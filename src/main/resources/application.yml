server:
  port: ${PORT:8083}

grpc:
  port: ${GRPC_PORT:9090}

spring:
  application:
    name: resource-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
    hikari:
      maximum-pool-size: 12
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
