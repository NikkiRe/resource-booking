services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    stop_grace_period: 20s
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booking
      DB_USER: booking
      DB_PASSWORD: booking
    ports:
      - "127.0.0.1:${API_PORT:-8083}:8083"
      - "127.0.0.1:${GRPC_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  booking-data:
